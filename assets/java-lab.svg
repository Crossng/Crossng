<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Java JVM lab</title>
  <desc id="desc">A green neon Java and Spring Boot laboratory banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#052e16" /><stop offset="0.55" stop-color="#14532d" /><stop offset="1" stop-color="#0f172a" /></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bbf7d0" stroke-opacity="0.1" /></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>
  <rect width="1200" height="170" rx="20" fill="url(#bg)" /><rect width="1200" height="170" rx="20" fill="url(#grid)" />
  <path d="M0 132H1200" stroke="#4ade80" stroke-opacity="0.35" /><path d="M660 132H1110" stroke="#86efac" stroke-width="2" stroke-dasharray="8 12" opacity="0.8"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur="2.5s" repeatCount="indefinite" /></path>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="66" y="63" fill="#bbf7d0" font-size="14" font-weight="700" letter-spacing="4">JAVA / JVM LAB</text>
    <text x="64" y="105" fill="#f0fdf4" font-size="34" font-weight="800">Spring Boot · APIs · Systems</text>
    <text x="66" y="137" fill="#bbf7d0" font-size="15">Maven  /  JavaParser  /  PostgreSQL  /  Docker</text>
    <g transform="translate(1000 78)" filter="url(#glow)"><circle r="30" fill="none" stroke="#86efac" stroke-width="2" stroke-dasharray="5 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" /></circle><circle r="7" fill="#bbf7d0"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite" /></circle></g>
  </g>
</svg>
