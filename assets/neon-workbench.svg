<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Crossng neon workbench</title>
  <desc id="desc">A dark neon developer workbench with macOS, Java and 3D vision focus areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617" /><stop offset="0.48" stop-color="#111827" /><stop offset="1" stop-color="#172554" /></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" /><stop offset="0.5" stop-color="#818cf8" /><stop offset="1" stop-color="#f472b6" /></linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.42" /><stop offset="1" stop-color="#38bdf8" stop-opacity="0" /></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#93c5fd" stroke-opacity="0.09" /></pattern>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16" /></filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)" /><rect width="1200" height="300" rx="22" fill="url(#grid)" />
  <circle cx="1020" cy="34" r="220" fill="url(#orb)" filter="url(#blur)"><animate attributeName="opacity" values="0.55;0.9;0.55" dur="5s" repeatCount="indefinite" /></circle>
  <circle cx="1040" cy="62" r="5" fill="#67e8f9" filter="url(#smallGlow)"><animate attributeName="cy" values="62;238;62" dur="7s" repeatCount="indefinite" /></circle>
  <path d="M0 248 C220 158 350 302 575 208 S935 96 1200 174" fill="none" stroke="url(#accent)" stroke-opacity="0.72" stroke-width="2" filter="url(#smallGlow)" />
  <path d="M0 268 C220 178 350 322 575 228 S935 116 1200 194" fill="none" stroke="#38bdf8" stroke-opacity="0.13" stroke-width="12" filter="url(#blur)" />
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="74" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="4">CROSSNG / DEVELOPER WORKBENCH</text>
    <text x="70" y="132" fill="#f8fafc" font-size="48" font-weight="800">Build useful things.</text>
    <text x="72" y="166" fill="#cbd5e1" font-size="17">Small tools · clear interfaces · solid engineering</text>
    <g transform="translate(72 204)">
      <rect width="132" height="34" rx="17" fill="#0e7490" fill-opacity="0.8" stroke="#67e8f9" stroke-opacity="0.7" /><text x="66" y="22" text-anchor="middle" fill="#ecfeff" font-size="13" font-weight="700">MACOS / SWIFT</text>
      <rect x="144" width="126" height="34" rx="17" fill="#4338ca" fill-opacity="0.8" stroke="#a5b4fc" stroke-opacity="0.7" /><text x="207" y="22" text-anchor="middle" fill="#eef2ff" font-size="13" font-weight="700">JAVA / SPRING</text>
      <rect x="282" width="114" height="34" rx="17" fill="#9d174d" fill-opacity="0.8" stroke="#f9a8d4" stroke-opacity="0.7" /><text x="339" y="22" text-anchor="middle" fill="#fdf2f8" font-size="13" font-weight="700">3D / VISION</text>
    </g>
  </g>
</svg>
